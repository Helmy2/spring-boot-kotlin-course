server:
  port: 8080

spring:
  application:
    name: shopcraft
  datasource:
    url: jdbc:h2:mem:shopcraft;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: dummy-github-client-id
            client-secret: dummy-github-client-secret
            scope:
              - read:user
              - user:email

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
    token-prefix: "Bearer "
    header-string: "Authorization"
  oauth2:
    authorized-redirect-uri: "http://localhost:8080/api/v1/auth/oauth2/callback"

logging:
  level:
    com.example.shopcraft: DEBUG
    org.springframework.security: INFO
